name: scheduler-benchmark

on:
  # Not a required PR gate yet — runtime + kind/kwok/Koordinator flakiness
  # makes it unsuitable as a blocking check on every PR. Run on demand and
  # nightly until the benchmark is stable enough to promote to a PR gate.
  workflow_dispatch: {}
  schedule:
    - cron: "0 3 * * *"   # nightly at 03:00 UTC

jobs:
  benchmark:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Free up ~14 GB of pre-installed tooling the benchmark doesn't need
      # (Android SDK, .NET, Haskell). Without this, building three Docker
      # images + running a kind cluster exhausts the runner's 14 GB disk.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          swap-storage: false
          large-packages: false
          docker-images: false
          android: true
          dotnet: true
          haskell: true

      # Install the kind CLI only — setup-cluster.sh creates the cluster
      # itself so only one place owns cluster lifecycle.
      - name: Install kind
        uses: helm/kind-action@v1.9.0
        with:
          install_only: true
          version: "v0.22.0"

      - name: Set up cluster
        run: make -C test/perf setup

      - name: Run benchmark (basic)
        run: |
          make -C test/perf benchmark \
            CONFIG=configs/scenarios/basic-1k.yaml \
            BASELINE=baselines/basic-1k.json

      # Gang scenario: no baseline yet — run for smoke-test only (confirms
      # scenario completes without crashing). Once a stable baseline is
      # captured from a green run, add BASELINE=baselines/gang-1k.json.
      - name: Run benchmark (gang)
        run: |
          make -C test/perf benchmark \
            CONFIG=configs/scenarios/gang-1k.yaml

      - name: Fail on regression
        if: always()
        run: |
          if [ -f test/perf/results/result.json ]; then
            breached=$(jq -r '.thresholdBreached' test/perf/results/result.json)
            echo "thresholdBreached=$breached"
            if [ "$breached" = "true" ]; then
              echo "::error::Benchmark regression detected — see uploaded result.json"
              exit 1
            fi
          fi

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-result
          path: test/perf/results/result.json

      # Debug BEFORE teardown — teardown deletes the kind cluster, after which
      # every kubectl command fails with "connection refused to localhost:8080".
      - name: Debug on failure
        if: failure()
        run: |
          echo "=== kind clusters ==="
          kind get clusters || true
          echo "=== docker containers (exit code reveals OOM-kill vs clean exit) ==="
          docker ps -a || true
          echo "=== control-plane container logs (last 100 lines) ==="
          docker logs koordinator-bench-control-plane --tail=100 2>&1 || true
          echo "=== disk space ==="
          df -h || true
          echo "=== memory ==="
          free -h || true
          echo "=== Pods (wide) ==="
          kubectl get pods -A -o wide || true
          echo "=== koord-scheduler logs ==="
          kubectl logs -n koordinator-system -l koord-app=koord-scheduler --tail=80 || true
          kubectl logs -n koordinator-system -l koord-app=koord-scheduler --previous --tail=80 2>/dev/null || true
          echo "=== koord-scheduler pod describe ==="
          kubectl describe pods -n koordinator-system -l koord-app=koord-scheduler || true
          echo "=== koordlet logs (crash detection) ==="
          kubectl logs -n koordinator-system -l koord-app=koordlet --tail=50 2>/dev/null || true
          kubectl logs -n koordinator-system -l koord-app=koordlet --previous --tail=50 2>/dev/null || true
          echo "=== koordlet pod describe ==="
          kubectl describe pods -n koordinator-system -l koord-app=koordlet 2>/dev/null || true
          echo "=== cluster events (all namespaces, sorted) ==="
          kubectl get events -A --sort-by=.lastTimestamp | tail -40 || true
          echo "=== koord-scheduler-config ConfigMap ==="
          kubectl get configmap koord-scheduler-config -n koordinator-system -o yaml || true

      - name: Teardown cluster
        if: always()
        run: make -C test/perf teardown
