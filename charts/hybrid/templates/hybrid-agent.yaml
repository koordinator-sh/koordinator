apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hybrid.fullname" . }}-agent
  namespace: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/name: {{ include "hybrid.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: agent
spec:
  replicas: {{ .Values.agent.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "hybrid.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "hybrid.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: agent
    spec:
      serviceAccountName: hybrid-agent
      securityContext:
        fsGroup: 65534
      containers:
        - name: hybrid-agent
          image: "{{ .Values.agent.image.repository }}:{{ .Values.agent.image.tag }}"
          imagePullPolicy: {{ .Values.agent.image.pullPolicy }}
          command: [ "hybrid-agent" ]
          args:
            - --exclude-namespaces=hybrid-system
            - --models={{ .Values.agent.models | join "," }}
            {{- if .Values.agent.modelResults.save }}
            - --save-model-results=true
            - --model-results-retention={{ .Values.agent.modelResults.retentionHours }}
            {{- end }}
            - --use-model-result-task-id={{ .Values.agent.modelResults.useTaskID }}
            {{- with .Values.agent.watcher }}
            - --poll-interval={{ .pollInterval }}
            - --poll-timeout={{ .pollTimeout }}
            - --long-poll-interval={{ .longPollInterval }}
            - --long-poll-timeout={{ .longPollTimeout }}
            {{- end }}
            {{- range .Values.agent.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            - name: AI_SERVER
              valueFrom:
                secretKeyRef:
                  name: hybrid-ai-credentials
                  key: AI_SERVER
            - name: AI_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hybrid-ai-credentials
                  key: AI_TOKEN
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config-volume
              mountPath: /etc/hybrid
              readOnly: true
            {{- if .Values.persistence.enabled }}
            - name: output-storage
              mountPath: /data
            {{- end }}
          securityContext:
            {{- toYaml .Values.agent.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
      volumes:
        - name: config-volume
          configMap:
            name: agent-config
        {{- if .Values.persistence.enabled }}
        - name: output-storage
          persistentVolumeClaim:
            claimName: hybrid-pvc
        {{- end }}
      restartPolicy: Always