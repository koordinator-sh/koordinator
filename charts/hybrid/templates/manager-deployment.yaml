{{- if .Values.manager.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: classifier-service
  namespace: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/name: {{ include "hybrid.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: manager
spec:
  selector:
    app: classifier-api
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hybrid.fullname" . }}-manager
  namespace: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/name: {{ include "hybrid.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: manager
spec:
  replicas: {{ .Values.manager.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "hybrid.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "hybrid.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: manager
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- end }}
      securityContext:
        fsGroup: 65534
      containers:
        - name: manager
          image: "{{ .Values.manager.image.repository }}:{{ .Values.manager.image.tag }}"
          imagePullPolicy: {{ .Values.manager.image.pullPolicy }}
          command: [ "hybrid-manager" ]
          args:
            - --sync-interval={{ .Values.manager.syncInterval }}
          {{- if .Values.manager.extraArgs }}
          {{- range .Values.manager.extraArgs }}
            - {{ . | quote }}
          {{- end }}
          {{- end }}
          env:
            - name: AI_SERVER
              valueFrom:
                secretKeyRef:
                  name: hybrid-ai-credentials
                  key: AI_SERVER
            - name: AI_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hybrid-ai-credentials
                  key: AI_TOKEN
          securityContext:
            {{- toYaml .Values.manager.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.manager.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: { }
{{- end }}