# Default values for hybrid chart

# Namespace configuration
namespace:
  create: false
  name: hybrid-system

# Hybrid Manager configuration
agent:
  image:
    repository: hybrid-system/hybrid-agent
    tag: v1.1
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    limits:
      cpu: 1000m
      memory: 2048Mi
    requests:
      cpu: 200m
      memory: 512Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  extraArgs:
    - "--exclude-namespaces=hybrid-system"
  # 模型返回原始 JSON 数据的持久化配置
  # 启用后将数据保存至 /data/hybrid-results/, 目录结构与 Prometheus 导出保持一致
  modelResults:
    save: false         # 是否持久化模型返回的原始 JSON 数据
    retentionHours: 24h # 文件保留时长, 超期自动清理
    # useTaskID: 是否在拉取模型结果时携带 task_id 查询参数
    # true（默认）: 按触发本次推理的任务 ID 取结果，多集群共用同一 AI 服务时
    #              可避免拿到其他集群的推理结果
    # false: 取全局最新结果（单集群场景可使用）
    useTaskID: true

  # 任务状态轮询配置
  # 短期/其他模型（Model4、Model5Short、Model6）使用 pollInterval/pollTimeout
  # 长期模型（Model5Long）使用 longPollInterval/longPollTimeout
  watcher:
    pollInterval: 10s    # 短期/其他任务状态查询间隔（建议 10s~30s）
    pollTimeout: 120m    # 短期/其他任务最长等待时间（超时视为失败）
    longPollInterval: 15m # 长期任务（Model5Long）状态查询间隔（建议 10m~20m）
    longPollTimeout: 30h  # 长期任务最长等待时间（长期训练通常超过 24h，需配置足够大）

config:
  prometheus:
    url: http://localhost:9090
    timeout: 30s
    auth:
      type: none # "none", "basic", "bearer"
      username: ""
      password: ""
      token: ""
  export:
    mode: local
    outputDir: /data/hybrid-output
    format: timestamp
    retentionHours: 4h
    exportInterval: 2h
  # 查询指标配置: range 配置支持: 12h, 24h, 72h, 1d, 7d, 14d, 30d等(长期预测必须大于 72h)
  # step 配置支持: 3m, 5m, 10m, 30m, 1h, 2h, 6h; range 较长时 step 配置不宜过小, 否则数据量太大
  queries:
    # CPU 指标
    - name: "cpu_usage"
      query: 'container_cpu_usage_seconds_total{__name__!=""}'
      range: "72h"                  # 查询时间范围
      step: "5m"                    # 数据点间隔

    - name: "cpu_quota"
      query: 'container_spec_cpu_quota{__name__!=""}'
      range: "72h"                  # 查询时间范围
      step: "5m"

    - name: "cpu_period"
      query: 'container_spec_cpu_period{__name__!=""}'
      range: "72h"                  # 查询时间范围
      step: "5m"

    # 内存指标
    - name: "memory_usage"
      query: 'container_memory_usage_bytes{__name__!=""}'
      range: "72h"
      step: "5m"

    - name: "memory_limit"
      query: 'container_spec_memory_limit_bytes{__name__!=""}'
      range: "72h"
      step: "5m"

    # IO 指标
    - name: "fs_reads"
      query: 'container_fs_reads_bytes_total{__name__!=""}'
      range: "72h"
      step: "5m"

    - name: "fs_writes"
      query: 'container_fs_writes_bytes_total{__name__!=""}'
      range: "72h"
      step: "5m"

    - name: "fs_io_time"
      query: 'container_fs_io_time_seconds_total{__name__!=""}'
      range: "72h"
      step: "5m"

    # 网络指标
    - name: "network_receive"
      query: 'container_network_receive_bytes_total{__name__!=""}'
      range: "72h"
      step: "5m"

    - name: "network_transmit"
      query: 'container_network_transmit_bytes_total{__name__!=""}'
      range: "72h"
      step: "5m"

    - name: "psi_collector"
      query: 'koordlet_container_psi{__name__!=""}'
      range: "72h"
      step: "5m"

    - name: "cpi_collector"
      query: 'koordlet_container_cpi{__name__!=""}'
      range: "72h"
      step: "5m"

    # 节点 CPU 指标
    - name: "node_cpu_usage"
      query: 'node_cpu_seconds_total{__name__!=""}'
      range: "72h"
      step: "5m"

    # 节点内存总量
    - name: "node_memory_total"
      query: 'node_memory_MemTotal_bytes{__name__!=""}'
      range: "72h"
      step: "5m"

    # 节点内存可用量
    - name: "node_memory_available"
      query: 'node_memory_MemAvailable_bytes{__name__!=""}'
      range: "72h"
      step: "5m"

    # 节点 IO 指标
    - name: "node_disk_reads"
      query: 'node_disk_read_bytes_total{__name__!=""}'
      range: "72h"
      step: "5m"

    - name: "node_disk_writes"
      query: 'node_disk_written_bytes_total{__name__!=""}'
      range: "72h"
      step: "5m"

# Persistent volume claim
persistence:
  enabled: true
  accessModes:
    - ReadWriteOnce
  storageClass: ""
  size: 10Gi

# AI credentials
aiCredentials:
  create: true
  server: http://10.64.7.230:8000
  token: aGVsbG8scHl0aG9ulQ==

# Service account configuration
serviceAccount:
  create: true
  name: hybrid-agent

# RBAC configuration
rbac:
  create: true