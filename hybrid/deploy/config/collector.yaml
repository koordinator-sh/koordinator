# Hybrid Collector 配置文件
# Prometheus 服务器配置
prometheus:
  url: "http://localhost:9090"   # Prometheus/VM 服务器地址
  timeout: 30s                   # 请求超时时间

# Local export config example
# export:
#  mode: "local"
#  localConfig:
#    outputDir: "./hybrid-collector-output"   # 输出目录
#    format: "timestamp"                      # 文件名格式: "timestamp" 或 "daily"
#  interval: 2h                               # 数据导出间隔(支持: s, m, h)

# Remote export config example
# export:
#  mode: "remote"
#  remoteConfig:
#    url: "ws://localhost:8080/metrics"   # websocket 服务
#  interval: 2h                           # 导出间隔(支持: s, m, h)

export:
  mode: "local" # 当前仅仅支持 local 模式
  localConfig:
    outputDir: "./hybrid-collector-output"   # 输出目录
    format: "timestamp"                      # 文件名格式: "timestamp" or "daily"
  interval: 2h                               # 数据导出间隔(支持: s, m, h)

# 查询指标配置
queries:
  # CPU 指标
  - name: "cpu_usage"
    query: 'container_cpu_usage_seconds_total{__name__!=""}'
    range: "24h"                  # 查询时间范围
    step: "3m"                    # 数据点间隔
    labels: # 要保留的数据标签
      - "namespace"
      - "pod"
      - "instance"
      - "job"
    sheetName: "cpu_usage"
    valueColumn: "cpu_usage"

  # 内存指标
  - name: "memory_usage"
    query: 'container_memory_usage_bytes{__name__!=""}'
    range: "24h"
    step: "3m"
    labels:
      - "namespace"
      - "pod"
      - "instance"
      - "job"
    sheetName: "memory_usage"
    valueColumn: "memory_usage"

  - name: "memory_limit"
    query: 'container_spec_memory_limit_bytes{__name__!=""}'
    range: "24h"
    step: "3m"
    labels:
      - "namespace"
      - "pod"
      - "instance"
      - "job"
    sheetName: "memory_limit"
    valueColumn: "memory_limit"


  # IO 指标
  - name: "fs_reads"
    query: 'container_fs_reads_bytes_total{__name__!=""}'
    range: "24h"
    step: "3m"
    labels:
      - "namespace"
      - "pod"
      - "instance"
      - "job"
    sheetName: "fs_reads"
    valueColumn: "fs_reads"

  - name: "fs_writes"
    query: 'container_fs_writes_bytes_total{__name__!=""}'
    range: "24h"
    step: "3m"
    labels:
      - "namespace"
      - "pod"
      - "instance"
      - "job"
    sheetName: "fs_writes"
    valueColumn: "fs_writes"

  # 网络指标
  - name: "network_receive"
    query: 'container_network_receive_bytes_total{__name__!=""}'
    range: "24h"
    step: "3m"
    labels:
      - "namespace"
      - "pod"
      - "instance"
      - "job"
    sheetName: "network_receive"
    valueColumn: "network_receive"

  - name: "network_transmit"
    query: 'container_network_transmit_bytes_total{__name__!=""}'
    range: "24h"
    step: "3m"
    labels:
      - "namespace"
      - "pod"
      - "instance"
      - "job"
    sheetName: "network_transmit"
    valueColumn: "network_transmit"