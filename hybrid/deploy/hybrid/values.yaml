# Default values for hybrid chart

# Namespace configuration
namespace:
  create: false
  name: hybrid-system

# Hybrid Manager configuration
agent:
  image:
    repository: hybrid-system/hybrid-agent
    tag: v1.1
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    limits:
      cpu: 500m
      memory: 2048Mi
    requests:
      cpu: 200m
      memory: 512Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  extraArgs:
    - "--exclude-namespaces=hybrid-system"

config:
  prometheus:
    url: http://localhost:9090
    timeout: 30s
    auth:
      type: none # "none", "basic", "bearer"
      username: ""
      password: ""
      token: ""
  export:
    mode: local
    outputDir: /data/hybrid-output
    format: timestamp
    exportInterval: 2h
  queries:
    # CPU 指标
    - name: "cpu_usage"
      query: 'container_cpu_usage_seconds_total{__name__!=""}'
      range: "24h"                  # 查询时间范围
      step: "3m"                    # 数据点间隔

    - name: "cpu_quota"
      query: 'container_spec_cpu_quota{__name__!=""}'
      range: "24h"                  # 查询时间范围
      step: "3m"

    - name: "cpu_period"
      query: 'container_spec_cpu_period{__name__!=""}'
      range: "24h"                  # 查询时间范围
      step: "3m"

    # 内存指标
    - name: "memory_usage"
      query: 'container_memory_usage_bytes{__name__!=""}'
      range: "24h"
      step: "3m"

    - name: "memory_limit"
      query: 'container_spec_memory_limit_bytes{__name__!=""}'
      range: "24h"
      step: "3m"

    # IO 指标
    - name: "fs_reads"
      query: 'container_fs_reads_bytes_total{__name__!=""}'
      range: "24h"
      step: "3m"

    - name: "fs_writes"
      query: 'container_fs_writes_bytes_total{__name__!=""}'
      range: "24h"
      step: "3m"

    - name: "fs_io_time"
      query: 'container_fs_io_time_seconds_total{__name__!=""}'
      range: "24h"
      step: "3m"

    # 网络指标
    - name: "network_receive"
      query: 'container_network_receive_bytes_total{__name__!=""}'
      range: "24h"
      step: "3m"

    - name: "network_transmit"
      query: 'container_network_transmit_bytes_total{__name__!=""}'
      range: "24h"
      step: "3m"

    - name: "psi_collector"
      query: 'koordlet_container_psi{__name__!=""}'
      range: "24h"
      step: "3m"

    - name: "cpi_collector"
      query: 'koordlet_container_cpi{__name__!=""}'
      range: "24h"
      step: "3m"

    # 节点 CPU 指标
    - name: "node_cpu_usage"
      query: 'node_cpu_seconds_total{__name__!=""}'
      range: "24h"
      step: "3m"

    # 节点内存总量
    - name: "node_memory_total"
      query: 'node_memory_MemTotal_bytes{__name__!=""}'
      range: "24h"
      step: "3m"

    # 节点内存可用量
    - name: "node_memory_available"
      query: 'node_memory_MemAvailable_bytes{__name__!=""}'
      range: "24h"
      step: "3m"

    # 节点 IO 指标
    - name: "node_disk_reads"
      query: 'node_disk_read_bytes_total{__name__!=""}'
      range: "24h"
      step: "3m"

    - name: "node_disk_writes"
      query: 'node_disk_written_bytes_total{__name__!=""}'
      range: "24h"
      step: "3m"

# Persistent volume claim
persistence:
  enabled: true
  accessModes:
    - ReadWriteOnce
  storageClass: ""
  size: 10Gi

# AI credentials
aiCredentials:
  create: true
  server: http://10.64.7.230:8000
  token: aGVsbG8scHl0aG9ulQ==

# Service account configuration
serviceAccount:
  create: true
  name: hybrid-agent

# RBAC configuration
rbac:
  create: true