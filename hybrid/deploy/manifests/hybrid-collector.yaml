---
apiVersion: v1
data:
  collector.yaml: |
    prometheus:
      url: "http://localhost:9090"   # Prometheus/VM 服务器地址
      timeout: 30s                   # 请求超时时间
    
    export:
      mode: "local" # 当前仅仅支持 local 模式
      localConfig:
        outputDir: "/data/hybrid-output"             # 输出目录
        format: "timestamp"                          # 文件名格式: "timestamp" or "daily"
      interval: 2h                                   # 数据导出间隔(支持: s, m, h)
    
    # 查询指标配置
    queries:
      # CPU 指标
      - name: "cpu_usage"
        query: 'container_cpu_usage_seconds_total{__name__!=""}'
        range: "24h"                  # 查询时间范围
        step: "3m"                    # 数据点间隔
      
      # 内存指标
      - name: "memory_usage"
        query: 'container_memory_usage_bytes{__name__!=""}'
        range: "24h"
        step: "3m"
      
      - name: "memory_limit"
        query: 'container_spec_memory_limit_bytes{__name__!=""}'
        range: "24h"
        step: "3m"
      
      
      # IO 指标
      - name: "fs_reads"
        query: 'container_fs_reads_bytes_total{__name__!=""}'
        range: "24h"
        step: "3m"
      
      - name: "fs_writes"
        query: 'container_fs_writes_bytes_total{__name__!=""}'
        range: "24h"
        step: "3m"
      
      # 网络指标
      - name: "network_receive"
        query: 'container_network_receive_bytes_total{__name__!=""}'
        range: "24h"
        step: "3m"
      
      - name: "network_transmit"
        query: 'container_network_transmit_bytes_total{__name__!=""}'
        range: "24h"
        step: "3m"
kind: ConfigMap
metadata:
  name: collector-config
  namespace: hybrid-system

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hybrid-output-pvc
  namespace: hybrid-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  # storageClassName: nfs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hybrid-collector
  namespace: hybrid-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: collector
  template:
    metadata:
      labels:
        app: hybrid-collector
    spec:
      containers:
        - name: hybrid-collector
          image: koordinator/hybrid-collector:v0.1.0
          imagePullPolicy: IfNotPresent
          command: [ "/app/collector" ]
          args: [ "--config", "/etc/hybrid/collector.yaml" ]
          volumeMounts:
            - name: config-volume
              mountPath: /etc/hybrid
              readOnly: true
            - name: output-storage
              mountPath: /data/hybrid-output # 必须与配置文件中的 outputDir 一致
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true # 推荐：以非 root 用户运行
            runAsUser: 1000    # 假设镜像中存在 UID 1000 的用户
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config-volume
          configMap:
            name: collector-config
        - name: output-storage
          persistentVolumeClaim:
            claimName: hybrid-output-pvc
      restartPolicy: Always
