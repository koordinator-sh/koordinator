---
# ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hybrid-manager
  namespace: hybrid-system

---
# ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hybrid-manager
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
      - statefulsets
    verbs:
      - get
      - list
      - watch
      - update
      - patch
  - apiGroups:
      - apps
    resources:
      - deployments/status
      - statefulsets/status
    verbs:
      - get
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - get
      - list
      - watch
      - update
      - patch
  - apiGroups:
      - batch
    resources:
      - jobs/status
    verbs:
      - get

---
# ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hybrid-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hybrid-manager
subjects:
  - kind: ServiceAccount
    name: hybrid-manager
    namespace: hybrid-system

---
# Mock API Service
apiVersion: v1
kind: Service
metadata:
  name: classifier-service
  namespace: hybrid-system
spec:
  selector:
    app: classifier-api
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP

---
# Controller Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hybrid-manager
  namespace: hybrid-system
  labels:
    app: hybrid-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hybrid-manager
  template:
    metadata:
      labels:
        app: hybrid-manager
    spec:
      serviceAccountName: hybrid-manager
      containers:
        - name: manager
          image: koordinator/hybrid-manager:v0.1.0
          imagePullPolicy: IfNotPresent
          command: ["/app/hybrid-manager"]
          args:
            - --prediction-file=/data/prediction-result.csv
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi