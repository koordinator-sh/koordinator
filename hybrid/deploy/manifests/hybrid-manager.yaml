---
# ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hybrid-manager
  namespace: hybrid-system

---
# ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hybrid-manager
rules:
  - apiGroups: [ "" ]
    resources: [ "pods" ]
    verbs: [ "get", "list", "watch" ]
  - apiGroups: [ "apps" ]
    resources: [ "deployments", "statefulsets", "daemonsets", "replicasets" ]
    verbs: [ "get", "list", "watch", "update", "patch" ]
  - apiGroups: [ "batch" ]
    resources: [ "jobs", "cronjobs" ]
    verbs: [ "get", "list", "watch", "update", "patch" ]

---
# ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hybrid-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hybrid-manager
subjects:
  - kind: ServiceAccount
    name: hybrid-manager
    namespace: hybrid-system

---
# Mock API Service
apiVersion: v1
kind: Service
metadata:
  name: classifier-service
  namespace: hybrid-system
spec:
  selector:
    app: classifier-api
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP

---
# Controller Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hybrid-manager
  namespace: hybrid-system
  labels:
    app: hybrid-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hybrid-manager
  template:
    metadata:
      labels:
        app: hybrid-manager
    spec:
      serviceAccountName: hybrid-manager
      securityContext:
        fsGroup: 65534
      containers:
        - name: manager
          image: koordinator/hybrid-manager:v1.0
          imagePullPolicy: IfNotPresent
          command: [ "hybrid-manager" ]
          args:
            - --sync-interval=5m
          env:
            - name: AI_SERVER
              valueFrom:
                secretKeyRef:
                  name: hybrid-ai-credentials
                  key: AI_SERVER
            - name: AI_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hybrid-ai-credentials
                  key: AI_TOKEN
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: { }