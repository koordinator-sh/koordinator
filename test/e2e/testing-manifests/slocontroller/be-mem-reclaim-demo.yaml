apiVersion: v1
kind: Pod
metadata:
  labels:
    app: e2e-test
    koordinator.sh/qosClass: BE
    name: be-mem-reclaim-demo
  name: be-mem-reclaim-demo
spec:
  schedulerName: koord-scheduler
  priorityClassName: koord-batch
  containers:
  - image: {{.BusyBoxImage}}
    imagePullPolicy: IfNotPresent
    name: pause
    command: ["sleep", "2000000000000"]
    resources:
      limits:
        kubernetes.io/batch-cpu: "1"
        kubernetes.io/batch-memory: 128Mi
      requests:
        kubernetes.io/batch-cpu: "1"
        kubernetes.io/batch-memory: 128Mi
  restartPolicy: Never